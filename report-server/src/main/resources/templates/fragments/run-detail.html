<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="metaCard">
      <nav class="breadcrumbs" aria-label="현재 위치">
        <a th:href="@{/}">
          서비스 목록
        </a>
        <span>
          /
        </span>
        <a th:href="@{/services/{org}/{service}(org=${run.org},service=${run.service})}" th:text="${run.org + ' / ' + run.service}">
        </a>
        <span>
          /
        </span>
        <span>
          실행 상세
        </span>
      </nav>
      <section class="run-summary">
        <div class="page-heading">
          <h1 class="page-title">
            테스트 실행 상세
            <span class="badge" th:classappend="${run.failCount == 0 ? 'text-bg-success' : 'text-bg-danger'}" th:text="${run.failCount == 0 ? 'PASS' : 'FAIL'}">
            </span>
          </h1>
          <a th:if="${run.reportPath != null and !#strings.isEmpty(run.reportPath)}" th:href="${run.reportPath}" target="_blank" rel="noopener" class="report-button">
            원본 리포트 열기
          </a>
        </div>
        <p class="run-context">
          <span th:text="${run.service}">
          </span>
          ·
          <span th:text="${run.source}">
          </span>
          ·
          <span th:text="${#strings.isEmpty(run.api) ? '전체 API' : run.api}">
          </span>
          ·
          <span th:text="${run.startedAt == null ? '시각 정보 없음' : #temporals.format(run.startedAt, 'yyyy-MM-dd HH:mm')}">
          </span>
        </p>
        <p class="run-id" th:text="${run.id}">
        </p>
        <div class="summary-strip run-stats">
          <span>
            전체 케이스
            <strong th:text="${run.totalCount}">
            </strong>
          </span>
          <span>
            성공
            <strong th:text="${run.passCount}">
            </strong>
          </span>
          <span>
            실패
            <strong class="text-danger" th:text="${run.failCount}">
            </strong>
          </span>
          <span>
            소요 시간
            <strong th:text="${#numbers.formatDecimal(run.durationMs / 1000.0, 1, 1) + 's'}">
            </strong>
          </span>
        </div>
      </section>
    </th:block>
    <th:block th:fragment="filterPanel">
      <section class="filter-panel">
        <div class="section-header">
          <h2 class="section-title">
            테스트 케이스
          </h2>
          <div class="toolbar">
            <div class="filter-group filter-group--wide">
              <label for="apiFilterInput" class="visually-hidden">
                API
              </label>
              <div class="autocomplete">
                <input id="apiFilterInput" type="text" class="form-control form-control-sm" placeholder="API 검색" autocomplete="off">
                <div id="apiAutocompletePanel" class="autocomplete-panel" hidden>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div hidden>
          <div class="filter-group">
            <label for="statusFilter">
              상태
            </label>
            <select id="statusFilter" class="form-select form-select-sm">
              <option value="">
                전체
              </option>
              <option th:each="s : ${allStatuses}" th:value="${s.name()}" th:text="${s.name()}">
              </option>
            </select>
          </div>
        </div>
        <details class="advanced-filters" id="caseAdvanced">
          <summary>
            상세 필터
          </summary>
          <div class="filter-grid">
            <div th:unless="${#lists.isEmpty(availableKinds)}" class="filter-group">
              <label for="kindFilter">
                유형
              </label>
              <select id="kindFilter" class="form-select form-select-sm">
                <option value="">
                  전체
                </option>
                <option th:each="k : ${availableKinds}" th:value="${k.name()}" th:text="${k.label}">
                </option>
              </select>
            </div>
            <div class="filter-group filter-group--wide">
              <label for="caseNameFilterInput">
                케이스 명
              </label>
              <div class="autocomplete">
                <input id="caseNameFilterInput" type="text" class="form-control form-control-sm" placeholder="케이스 명 검색" autocomplete="off">
                <div id="caseNameAutocompletePanel" class="autocomplete-panel" hidden>
                </div>
              </div>
            </div>
            <div class="filter-group filter-group--wide">
              <label for="endpointFilterInput">
                엔드포인트
              </label>
              <div class="autocomplete">
                <input id="endpointFilterInput" type="text" class="form-control form-control-sm" placeholder="엔드포인트 검색" autocomplete="off">
                <div id="endpointAutocompletePanel" class="autocomplete-panel" hidden>
                </div>
              </div>
            </div>
            <div class="filter-group">
              <label for="methodFilter">
                메서드
              </label>
              <select id="methodFilter" class="form-select form-select-sm">
                <option value="">
                  전체
                </option>
              </select>
            </div>
            <div class="filter-group">
              <label for="httpStatusFilter">
                HTTP 상태 코드
              </label>
              <select id="httpStatusFilter" class="form-select form-select-sm">
                <option value="">
                  전체
                </option>
              </select>
            </div>
          </div>
        </details>
        <button type="button" id="resetFilterBtn" class="reset-link">
          필터 초기화
        </button>
        <div class="status-tabs" data-status-control="statusFilter" aria-label="케이스 상태 필터">
          <button type="button" data-status="" aria-pressed="true">
            전체
            <span class="tab-count">
              0
            </span>
          </button>
          <button type="button" data-status="FAIL" aria-pressed="false">
            실패
            <span class="tab-count">
              0
            </span>
          </button>
          <button type="button" data-status="PASS" aria-pressed="false">
            성공
            <span class="tab-count">
              0
            </span>
          </button>
        </div>
      </section>
    </th:block>
    <th:block th:fragment="casesSection">
      <div id="emptyState" class="empty-state" style="display:none">
        조건과 일치하는 테스트 케이스가 없습니다.
      </div>
      <div class="case-workspace">
        <div class="case-list">
          <div class="table-wrapper" th:classappend="${#lists.isEmpty(cases)} ? 'is-hidden' : ''">
            <table id="casesTable" class="table report-table">
              <thead>
                <tr>
                  <th>
                    상태
                  </th>
                  <th>
                    케이스 · API
                  </th>
                  <th>
                    HTTP
                  </th>
                  <th>
                    시간
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="c : ${cases}" th:attr="data-status=${c.status != null ? c.status.name() : ''},data-kind=${c.kind != null ? c.kind.name() : ''},data-kind-label=${c.kind != null ? c.kind.label : ''},data-api=${c.api != null ? c.api : ''},data-name=${c.name != null ? c.name : ''},data-scenario-name=${c.scenarioName != null ? c.scenarioName : ''},data-endpoint=${c.endpoint != null ? c.endpoint : ''},data-method=${c.httpMethod != null ? c.httpMethod : ''},data-http-status=${c.httpStatus > 0 ? c.httpStatus : ''},data-failure=${c.failureMsg}">
                  <td>
                    <span class="badge" th:classappend="${c.status == null ? 'text-bg-secondary' : (c.status.name() == 'FAIL' ? 'text-bg-danger' : 'text-bg-success')}" th:text="${c.status == null ? '알 수 없음' : c.status}">
                    </span>
                  </td>
                  <td>
                    <button type="button" class="case-select" aria-controls="caseInspector" aria-pressed="false" th:text="${c.name != null ? c.name : '이름 없는 케이스'}">
                    </button>
                    <span class="case-api" th:text="${c.api}">
                    </span>
                    <span class="scenario-name" th:if="${c.scenarioName != null and c.scenarioName != c.name}" th:text="${c.scenarioName}">
                    </span>
                  </td>
                  <td th:text="${c.httpStatus > 0 ? c.httpStatus : '—'}">
                  </td>
                  <td class="duration" th:text="${c.durationMs > 0 ? #numbers.formatDecimal(c.durationMs / 1000.0, 1, 1) + 's' : '—'}">
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <p id="caseCount" class="page-note" aria-live="polite" th:text="${cases.size() + '개 케이스'}">
          </p>
        </div>
        <aside id="caseInspector" class="case-inspector" aria-label="선택한 테스트 케이스" hidden>
          <h2 id="inspectorName" class="section-title">
          </h2>
          <span id="inspectorKind" class="badge text-bg-secondary">
          </span>
          <dl>
            <dt>
              API
            </dt>
            <dd id="inspectorApi">
            </dd>
            <dt>
              시나리오
            </dt>
            <dd id="inspectorScenario">
            </dd>
            <dt>
              메서드
            </dt>
            <dd id="inspectorMethod">
            </dd>
            <dt>
              HTTP
            </dt>
            <dd id="inspectorHttp">
            </dd>
            <dt>
              엔드포인트
            </dt>
            <dd id="inspectorEndpoint">
            </dd>
          </dl>
          <div class="section-header">
            <h3>
              실패 메시지
            </h3>
            <button type="button" id="copyFailure" class="quiet-button">
              복사
            </button>
          </div>
          <pre id="inspectorFailure">
          </pre>
          <p id="copyStatus" role="status" class="page-note">
          </p>
          <p class="page-note">
            전체 실행 로그는 원본 리포트에서 확인하세요.
          </p>
        </aside>
      </div>
    </th:block>
  </body>
</html>
