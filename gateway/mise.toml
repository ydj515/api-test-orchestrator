min_version = "2026.9.18"

[settings]
lockfile = false

[vars]
runtime_env = "local"
spring_profile = "local"

[env]
APP_ENV = "{{ vars.runtime_env }}"

[tools]
java = "21.0.2"

[tasks."run"]
description = "Start the gateway service"
env = { "SPRING_PROFILES_ACTIVE" = "{{ vars.spring_profile }}" }
depends = ["guard:local"]
run = "./gradlew bootRun"

[tasks.build]
description = "Compile, test, and package"
run = "./gradlew build"

[tasks.test]
description = "Run JUnit 5 test suite"
run = "./gradlew test"

[tasks.clean]
description = "Clean build artifacts"
run = "./gradlew clean"

[tasks."bootstrap"]
description = "Install pinned tools and project dependencies; do not start services"
run = "mise install java@21.0.2\n./gradlew --version"

[tasks."config:check"]
description = "Validate task references without starting applications"
run = "mise tasks validate --errors-only"

[tasks."verify"]
description = "Run the repository quality gate"
run = "./gradlew check"

[tasks."ci"]
description = "Run the repository quality gate"
run = "mise run verify"

[tasks."guard:local"]
description = "Reject local services under a production environment"
hide = true
run = "case \"$APP_ENV\" in local|dev|development) ;; *) echo 'Local services require the default or dev environment' >&2; exit 1 ;; esac"
